name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Install document converters
        shell: pwsh
        run: choco install pandoc libreoffice-fresh --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "0.1.0.$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace "^v", ""
          }
          .\installer\build.ps1 -Version $version

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-windows-installer-${{ github.sha }}
          path: dist/evidence-setup-*-windows-x64.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/evidence-setup-*-windows-x64.exe